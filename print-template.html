<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onderzoeksrapport Keyboard Conversion Management</title>
  <style>
    @page { size: A4; margin: 18mm 17mm 19mm; }
    * { box-sizing: border-box; }
    html { font-family: "Segoe UI", Arial, sans-serif; color: #172033; font-size: 10.25pt; line-height: 1.48; }
    body { margin: 0; }
    h1 { color: #123f5a; font-size: 27pt; line-height: 1.1; margin: 18mm 0 8mm; border-bottom: 4px solid #2aa198; padding-bottom: 7mm; }
    h1 + p { font-size: 10.5pt; color: #44546a; }
    h2 { color: #123f5a; font-size: 17pt; line-height: 1.2; margin: 9mm 0 3mm; page-break-after: avoid; border-bottom: 1px solid #cad6df; padding-bottom: 1.5mm; }
    h3 { color: #176b72; font-size: 12.5pt; margin: 6mm 0 2mm; page-break-after: avoid; }
    h4 { color: #34495e; font-size: 11pt; margin: 4mm 0 1.5mm; page-break-after: avoid; }
    p { margin: 0 0 3mm; orphans: 3; widows: 3; }
    ul, ol { margin: 1.5mm 0 3.5mm 6mm; padding-left: 5mm; }
    li { margin: 0 0 1.2mm; }
    strong { color: #142b3d; }
    code { font-family: Consolas, monospace; font-size: 9pt; background: #edf3f6; padding: 0.2mm 0.8mm; border-radius: 1mm; overflow-wrap: anywhere; }
    blockquote { margin: 4mm 0; padding: 3mm 4mm; border-left: 4px solid #2aa198; background: #eef8f7; color: #24444a; }
    table { border-collapse: collapse; width: 100%; margin: 3mm 0 5mm; font-size: 8.6pt; page-break-inside: auto; }
    tr { page-break-inside: avoid; page-break-after: auto; }
    th { background: #174f68; color: white; text-align: left; font-weight: 600; }
    th, td { border: 1px solid #bdcbd4; padding: 1.8mm 2mm; vertical-align: top; }
    tbody tr:nth-child(even) { background: #f3f7f9; }
    a { color: #0b6971; text-decoration: none; overflow-wrap: anywhere; }
    hr { border: 0; border-top: 1px solid #cad6df; margin: 6mm 0; }
    h2:nth-of-type(1) { break-before: page; }
    @media print {
      a[href]::after { content: none; }
      h1, h2, h3, h4 { break-inside: avoid; }
    }
  </style>
</head>
<body>

</body>
</html>
