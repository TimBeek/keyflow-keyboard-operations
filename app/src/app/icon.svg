<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    Een toets met de R van ReKey.

    Eerdere versies hadden een toetsdop mét randje en daarin een blauwe letter op
    wit. Groot ziet dat er goed uit, maar een tabblad is zestien pixels: de
    letter werd daar ongeveer zeven pixels blauw op wit, midden in nog meer
    blauw, en dan zie je alleen een vlekje. Naast elkaar gezet op ware grootte
    won er maar één ding: een grote witte letter op een vol blauw vlak.

    Het afgeronde vierkant ís de toetsdop — die vorm hoef je niet nog eens te
    tekenen. Het blauw is dat van de app (#1B72C4, --signal in licht). Vaste
    kleuren hier, want een tabblad leest geen stylesheet.
  -->
  <rect width="40" height="40" rx="10" fill="#1B72C4"/>
  <text x="20" y="30.5" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#FFFFFF">R</text>
</svg>
