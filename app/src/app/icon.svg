<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    Hetzelfde beeldmerk als in de app: een vel dat op een toets komt.
    Hier met vaste kleuren, want een browsertabblad leest geen stylesheet.
    Het blauw is dat van de app (--signal, #2E9BF0).
  -->
  <rect width="40" height="40" rx="11" fill="#2E9BF0"/>
  <rect x="7" y="14" width="19" height="19" rx="4.5" fill="#FFFFFF" fill-opacity="0.38"/>
  <rect x="10" y="17" width="13" height="13" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="17" y="7" width="16" height="16" rx="3.5" fill="#FFFFFF"/>
</svg>
