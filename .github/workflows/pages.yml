name: Publish preview to GitHub Pages

# Deze publicatie is uitgezet.
#
# Er stond hier een meekijkversie van de app, gebouwd bij elke push naar main en
# publiek bereikbaar zonder inlog. Die versie praat niet met de database — er
# stonden dus geen voorraadstanden, ordernummers of aanvragen in — maar de
# meegeleverde code bevatte wél de volledige stickercatalogus: alle
# artikelnummers, alle 148 hangmapnummers met de bijbehorende laptopmodellen, de
# naam van de leverancier en een medewerkersnaam. Dat hoort niet op een open
# adres te staan.
#
# In plaats van de app publiceert dit nu één lege pagina, zodat wat er stond
# meteen verdwijnt. Wil je de site helemaal weg hebben, zet Pages dan uit onder
# Settings > Pages > Source > None; daarna mag dit bestand ook weg.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build a page with nothing on it
        run: |
          mkdir -p leeg
          cat > leeg/index.html <<'HTML'
          <!doctype html>
          <html lang="nl">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex, nofollow" />
              <title>Niet in gebruik</title>
            </head>
            <body>
              <p>Deze pagina is niet in gebruik.</p>
            </body>
          </html>
          HTML
          cp leeg/index.html leeg/404.html
          touch leeg/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: leeg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
